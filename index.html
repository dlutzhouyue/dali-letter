<script>
'use strict';
(() => {
 const $=id=>document.getElementById(id), story=$('story'), svg=$('scene');
 const parts=Object.fromEntries(['legBack','shoeBack','legFront','shoeFront','torso','neck','manHand','armBack','arm','sleeve','manHead','manShadow','heart','womanLegBack','womanShoeBack'].map(id=>[id,$(id)]));
 const duration=DaliMotion.duration, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let elapsed=0,last=0,playing=false,started=false,visible=false,manualPause=false,frame=0;
 const clamp=n=>Math.max(0,Math.min(1,n)), ease=n=>{n=clamp(n);return n*n*(3-2*n)}, mix=(a,b,n)=>a+(b-a)*n;
 function line(el,points){el.setAttribute('d',points.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '))}
 function womanLeg(p){
  const normal=(a,b)=>{const d=Math.hypot(b[0]-a[0],b[1]-a[1]);return [(b[1]-a[1])/d,-(b[0]-a[0])/d]};
  const upper=normal(p.hip,p.knee),lower=normal(p.knee,p.ankle);
  const kneeNormal=[(upper[0]+lower[0])/2,(upper[1]+lower[1])/2];
  const offset=(v,n,w)=>[v[0]+n[0]*w,v[1]+n[1]*w];
  const outline=[offset(p.hip,upper,8),offset(p.knee,kneeNormal,7),offset(p.ankle,lower,5),offset(p.ankle,lower,-5),offset(p.knee,kneeNormal,-7),offset(p.hip,upper,-8)];
  parts.womanLegBack.setAttribute('d',outline.map((v,i)=>(i?'L':'M')+v).join(' ')+'Z');
  parts.womanShoeBack.setAttribute('transform',`translate(${p.ankle[0]-965},${p.ankle[1]-753})`);
 }
 function pose(t){
  const p=DaliMotion.pose(t);
  womanLeg(DaliMotion.footPose(t));
  line(parts.legBack,[p.hip,p.k1,p.f1]);line(parts.shoeBack,[[p.f1[0]-8,p.f1[1]+2],[p.f1[0]+12,p.f1[1]+2]]);
  line(parts.legFront,[p.hip,p.k2,p.f2]);line(parts.shoeFront,[[p.f2[0]-5,p.f2[1]+2],[p.f2[0]+17,p.f2[1]+2]]);
  const dx=p.hip[0]-p.shoulder[0],dy=p.hip[1]-p.shoulder[1],bodyAngle=Math.atan2(-dx,dy)*180/Math.PI;
  parts.torso.setAttribute('transform',`translate(${p.shoulder}) rotate(${bodyAngle}) scale(1.15,${Math.hypot(dx,dy)/74})`);
  const headAngle=p.angle*Math.PI/180;
  line(parts.neck,[p.shoulder,[p.head[0]-Math.sin(headAngle)*21,p.head[1]+Math.cos(headAngle)*21]]);
  parts.manHand.setAttribute('transform',`translate(${p.hand}) rotate(${Math.atan2(p.hand[1]-p.elbow[1],p.hand[0]-p.elbow[0])*180/Math.PI})`);
  line(parts.armBack,[p.shoulder,p.elbowBack,p.handBack]);
  line(parts.arm,[p.shoulder,p.elbow,p.hand]);line(parts.sleeve,[p.shoulder,[mix(p.shoulder[0],p.elbow[0],.54),mix(p.shoulder[1],p.elbow[1],.54)]]);
  parts.manHead.setAttribute('transform',`translate(${p.head}) rotate(${p.angle}) scale(1.03)`);parts.manShadow.setAttribute('cx',p.hip[0]);parts.manShadow.setAttribute('rx',t>7?68:43);
  const affection=ease((t-14.5)/1.6);parts.heart.style.opacity=affection*.85;parts.heart.setAttribute('transform',`translate(0,${-affection*12})`);
  $('womanHead').setAttribute('transform',`rotate(${-ease((t-8)/5)*3} 982 566)`);
 }
 function render(){
  pose(elapsed);
  const looping=elapsed>=DaliMotion.loopStart;
  $('progress').style.width=(looping?100:elapsed/DaliMotion.loopStart*100)+'%';
  $('time').textContent=looping?'∞ 循环':`00:${String(Math.floor(elapsed)).padStart(2,'0')}`;
  const track=document.querySelector('.track');
  track.setAttribute('aria-valuenow',elapsed.toFixed(1));
  track.setAttribute('aria-valuetext',looping?'结尾循环播放':$('time').textContent);
 }
 function sync(){const active=playing&&visible&&!document.hidden;story.classList.toggle('ambient-paused',!active);$('toggle').textContent=playing?'Ⅱ 暂停':'▷ 播放';$('toggle').setAttribute('aria-label',playing?'暂停动画':'播放动画');cancelAnimationFrame(frame);last=0;if(active)frame=requestAnimationFrame(tick)}
 function tick(now){if(last)elapsed=DaliMotion.loopTime(elapsed+(now-last)/1000);last=now;render();frame=requestAnimationFrame(tick)}
 function play(reset=false){if(reset)elapsed=0;started=true;manualPause=false;playing=true;render();sync()}
 $('toggle').addEventListener('click',()=>{if(playing){playing=false;manualPause=true;sync()}else play()});
 $('replay').addEventListener('click',()=>play(true));
 new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(visible&&!started&&!manualPause&&!reduced)play();else sync()},{threshold:.45}).observe(story);
 document.addEventListener('visibilitychange',sync);
 // 两层花瓣使用错开的负延迟，打开时即可看到满屏花雨。
 const petalFields=[];
 for(const section of [document.querySelector('.hero'),story]){
  const field=document.createElement('div');field.className='petal-field';field.setAttribute('aria-hidden','true');
  const fragment=document.createDocumentFragment();
  for(let i=0;i<76;i++){
   const petal=document.createElement('i'),near=i%4===0;
   petal.className='falling-petal'+(near?' near':'');
   const duration=near?12+(i%7):20+(i%11);
   const variables={'--left':((i*37.17)%116-8)+'%','--size':(near?12+i%7:5+i%5)+'px','--duration':duration+'s','--delay':(-((i*.61803398875)%1)*duration)+'s','--drift':(i%2?65+i%55:-35-i%35)+'px','--turn':(3+i%5)+'s','--alpha':near?'.68':'.46','--color':['#dca1a4','#e6b5aa','#cf8f9a','#edd0b8'][i%4],'--rest-top':((i*17)%100)+'%','--rest-angle':(i*47%360)+'deg'};
   for(const [key,value]of Object.entries(variables))petal.style.setProperty(key,value);
   const shape=document.createElement('span');shape.className='petal-shape';petal.append(shape);fragment.append(petal);
  }
  field.append(fragment);section.append(field);petalFields.push(field);
 }
 const hero=document.querySelector('.hero');let heroVisible=true;
 function syncHero(){hero.classList.toggle('ambient-paused',!heroVisible||document.hidden)}
 new IntersectionObserver(entries=>{heroVisible=entries[0].isIntersecting;syncHero()},{threshold:0}).observe(hero);
 document.addEventListener('visibilitychange',syncHero);
 function resize(){
  const bounds=svg.getBoundingClientRect(),height=600*bounds.height/Math.max(1,bounds.width);
  svg.setAttribute('viewBox',`510 ${900-height} 600 ${height}`);svg.setAttribute('preserveAspectRatio','xMidYMax meet');
  for(const field of petalFields)field.style.setProperty('--fall-distance',(field.parentElement.clientHeight+80)+'px');
 }
 window.addEventListener('resize',resize);resize();render();
})();
</script>

<script>
(() => {
'use strict';
const $=id=>document.getElementById(id),audio=$('audio'),sound=$('sound'),musicHint=$('musicHint'),scroller=document;
let started=false,userPaused=false,playAttempt=0;
function playing(value){
 sound.textContent=value?'♫ 音乐播放中':'♫ 开启音乐';
 sound.setAttribute('aria-label',value?'暂停背景音乐':'播放背景音乐');sound.title=value?'暂停背景音乐':'播放背景音乐';sound.setAttribute('aria-pressed',String(value));
 if(value){started=true;musicHint.hidden=true;sound.classList.remove('error');}
}
function startMusic(manual){
 if(manual)userPaused=false;
 if(userPaused||!audio.paused)return;
 const attempt=++playAttempt;
 // play() 直接发生在点击或桥接事件内，不在异步等待后才调用。
 try{
  if(audio.error)audio.load();
  const result=audio.play();
  if(result&&typeof result.then==='function')result.then(()=>{if(attempt===playAttempt&&!userPaused&&!audio.paused)playing(true);}).catch(()=>{
   if(attempt!==playAttempt||userPaused||!audio.paused)return;
   musicHint.textContent='♫ 点一下，播放音乐';musicHint.hidden=false;
  });
 }catch(e){musicHint.textContent='♫ 点一下，播放音乐';musicHint.hidden=false;}
}
audio.autoplay=true;audio.preload='auto';audio.muted=false;audio.volume=1;

audio.addEventListener('play',()=>{sound.textContent='♫ 音乐加载中';});
audio.addEventListener('waiting',()=>{sound.textContent='♫ 音乐缓冲中';sound.setAttribute('aria-pressed','false');});audio.addEventListener('playing',()=>playing(true));audio.addEventListener('pause',()=>playing(false));
audio.addEventListener('error',()=>{sound.classList.add('error');sound.textContent='♫ 音乐重试';musicHint.textContent='音乐加载失败，轻触重试';musicHint.hidden=false;});
audio.addEventListener('canplay',()=>{if(!started&&!userPaused)startMusic(false);});
sound.addEventListener('click',()=>{if(audio.paused)startMusic(true);else{userPaused=true;++playAttempt;audio.pause();musicHint.hidden=true;}});
musicHint.addEventListener('click',()=>{if(audio.error)audio.load();startMusic(true);});
// 微信可在桥接就绪时重新尝试；不加载 SDK，不要求签名或任何外部依赖。
document.addEventListener('WeixinJSBridgeReady',()=>startMusic(false),false);
window.addEventListener('pageshow',()=>{if(!userPaused)startMusic(false);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!userPaused)startMusic(false);});
function unlock(e){if(userPaused||!audio.paused)return;const el=e.target;if(el&&el.closest&&el.closest('#sound,#musicHint'))return;startMusic(false);}
document.addEventListener('touchend',unlock,{passive:true,capture:true});
document.addEventListener('click',unlock,true);
scroller.addEventListener('touchstart',unlock,{passive:true});
audio.load();startMusic(false);

})();
</script>
